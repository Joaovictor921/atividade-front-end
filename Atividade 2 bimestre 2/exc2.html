<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Dinâmico de Temperatura</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #e9ecef; margin: 0; }
        .converter-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        .input-group { margin: 20px 0; text-align: left; }
        label { font-weight: bold; color: #495057; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ced4da; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="converter-box">
    <h2>Conversor de Temperatura</h2>
    
    <div class="input-group">
        <label for="celsius">Celsius (°C)</label>
        <input type="number" id="celsius" step="0.1" placeholder="Ex: 25.00">
    </div>

    <div class="input-group">
        <label for="fahrenheit">Fahrenheit (°F)</label>
        <input type="number" id="fahrenheit" step="0.1" placeholder="Ex: 77.00">
    </div>
</div>

<script>
    const celsiusInput = document.getElementById('celsius');
    const fahrenheitInput = document.getElementById('fahrenheit');

    celsiusInput.addEventListener('input', () => {
        if (celsiusInput.value === '') {
            fahrenheitInput.value = '';
            return;
        }
        const c = parseFloat(celsiusInput.value);
        const f = (c * 9/5) + 32;
        fahrenheitInput.value = f.toFixed(2);
    });

    fahrenheitInput.addEventListener('input', () => {
        if (fahrenheitInput.value === '') {
            celsiusInput.value = '';
            return;
        }
        const f = parseFloat(fahrenheitInput.value);
        const c = (f - 32) * 5/9;
        celsiusInput.value = c.toFixed(2);
    });
</script>

</body>
</html>
