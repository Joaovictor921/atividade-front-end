<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Média Escolar</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #fdfdfd; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #333; }
        input { width: 100%; padding: 8px; margin: 8px 0 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        #feedback { margin-top: 20px; padding: 15px; border-radius: 5px; text-align: center; font-weight: bold; display: none; }
        .aprovado { background-color: #cce5ff; color: #004085; border: 1px solid #b8daff; }
        .exame { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .reprovado { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="card">
    <h2>Média Escolar</h2>
    <label>Nome do Aluno:</label>
    <input type="text" id="nome" placeholder="Digite o nome">

    <label>Nota 1:</label>
    <input type="number" id="n1" step="0.1" min="0" max="10">

    <label>Nota 2:</label>
    <input type="number" id="n2" step="0.1" min="0" max="10">

    <label>Nota 3:</label>
    <input type="number" id="n3" step="0.1" min="0" max="10">

    <button id="btnCalcular">Calcular Média</button>

    <div id="feedback"></div>
</div>

<script>
    document.getElementById('btnCalcular').addEventListener('click', () => {
        const nome = document.getElementById('nome').value;
        const n1 = Number(document.getElementById('n1').value);
        const n2 = Number(document.getElementById('n2').value);
        const n3 = Number(document.getElementById('n3').value);
        const feedback = document.getElementById('feedback');

        if (!nome || isNaN(n1) || isNaN(n2) || isNaN(n3)) {
            alert("Preencha todos os campos corretamente!");
            return;
        }

        const media = (n1 + n2 + n3) / 3;
        feedback.style.display = 'block';

        if (media >= 6.0) {
            feedback.className = 'aprovado';
            feedback.innerHTML = `${nome}, você foi <strong>Aprovado</strong>!<br>Média: ${media.toFixed(2)}`;
        } else if (media >= 4.0) {
            const falta = 10 - media;
            feedback.className = 'exame';
            feedback.innerHTML = `${nome}, você está em <strong>Exame</strong>.<br>Média: ${media.toFixed(2)}<br>Falta ${falta.toFixed(2)} para atingir 10.0`;
        } else {
            feedback.className = 'reprovado';
            feedback.innerHTML = `${nome}, você foi <strong>Reprovado</strong>.<br>Média: ${media.toFixed(2)}`;
        }
    });
</script>

</body>
</html>
