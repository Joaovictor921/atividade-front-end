<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de CPF</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        input { width: 80%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; text-align: center; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #0056b3; }
        #resultado { margin-top: 20px; font-weight: bold; font-size: 18px; padding: 10px; border-radius: 5px; display: none; }
        .valido { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .invalido { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="card">
    <h2>Validador de CPF</h2>
    <input type="text" id="cpfInput" placeholder="Digite o CPF (apenas números)" maxlength="14">
    <br>
    <button onclick="validarCPF()">Validar</button>
    <div id="resultado"></div>
</div>

<script>
function calcularDigito(cpf, fatorInicial) {
    let soma = 0;
    for (let i = 0; i < fatorInicial - 1; i++) {
        soma += parseInt(cpf[i]) * (fatorInicial - i);
    }
    let resto = (soma * 10) % 11;
    return resto === 10 ? 0 : resto;
}

function validarCPF() {
    const input = document.getElementById('cpfInput').value;
    const divResultado = document.getElementById('resultado');
    
    
    const cpf = input.replace(/\D/g, '');

    
    if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) {
        exibirResultado(false);
        return;
    }

    
    const digito1 = calcularDigito(cpf, 10);
    
    const digito2 = calcularDigito(cpf, 11);

    
    const valido = (digito1 === parseInt(cpf[9])) && (digito2 === parseInt(cpf[10]));
    
    exibirResultado(valido);
}

function exibirResultado(valido) {
    const divResultado = document.getElementById('resultado');
    divResultado.style.display = 'block';
    if (valido) {
        divResultado.textContent = 'CPF Válido!';
        divResultado.className = 'valido';
    } else {
        divResultado.textContent = 'CPF Inválido!';
        divResultado.className = 'invalido';
    }
}
</script>

</body>
</html>
